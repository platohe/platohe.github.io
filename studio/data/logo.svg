<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="dm-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#dm-gradient)"/>
  
  <!-- Data input block -->
  <rect x="5" y="7" width="8" height="7" rx="1.5" fill="white" opacity="0.95"/>
  
  <!-- Flow arrow -->
  <path d="M14 10.5 L18 10.5 L18 8 L22 11 L18 14 L18 11.5 L14 11.5 Z" fill="white"/>
  
  <!-- Data output block (transformed) -->
  <rect x="19" y="14" width="8" height="7" rx="1.5" fill="white" opacity="0.7"/>
  
  <!-- Second flow arrow -->
  <path d="M18 17.5 L14 17.5 L14 15 L10 18 L14 21 L14 18.5 L18 18.5 Z" fill="white" opacity="0.8"/>
  
  <!-- Bottom data block -->
  <rect x="5" y="20" width="8" height="5" rx="1.5" fill="white" opacity="0.5"/>
</svg>
