        <p class="ns-boot-title">Loading notebooks…</p>
        <p class="ns-boot-detail">note |STUDIO keeps every notebook on this device.</p>

    <script>

        // overwritten by a late error.

        function fail(detail) {

          boot.setAttribute('role', 'alert')
          boot.innerHTML = ''
          var title = document.createElement('p')
          title.className = 'ns-boot-title'
          title.textContent = 'note |STUDIO could not start'
          var why = document.createElement('p')
          why.className = 'ns-boot-detail'
          why.textContent = detail

          action.type = 'button'
          action.className = 'ns-boot-action'
