<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VisualizationStudio Embed</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    #vs-embed { width: 100%; min-height: 200px; }
    #vs-embed:empty::after { content: 'Loading chart…'; display: block; padding: 24px; font: 14px system-ui; color: #64748b; }
  </style>
</head>
<body>
  <div id="vs-embed" role="img" aria-label="Embedded VisualizationStudio chart"></div>
  <script type="module">
    // Lightweight host: forwards ?spec/?stored/?chart to the app's EmbedPage
    // via postMessage resize relay. Parent usage:
    // <iframe src="/embed.html?embed=true&chart=bar-chart&spec=..." sandbox="allow-scripts" />
    const params = new URLSearchParams(location.search);
    const target = new URL(import.meta.env?.BASE_URL ?? './', location.href);
    // Delegate rendering to the SPA route; this shell auto-resizes.
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'vs-resize') {
        document.getElementById('vs-embed').style.height = e.data.height + 'px';
        window.parent?.postMessage(e.data, '*');
      }
    });
    const frame = document.createElement('iframe');
    frame.src = '/?' + params.toString();
    frame.style.cssText = 'border:0;width:100%;height:100vh;display:block';
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    frame.title = 'VisualizationStudio chart';
    document.getElementById('vs-embed').appendChild(frame);
  </script>
</body>
</html>
