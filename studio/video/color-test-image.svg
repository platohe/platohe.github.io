<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#feca57;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ff9ff3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#54a0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Sunset circle -->
  <circle cx="400" cy="350" r="150" fill="url(#sunset)"/>
  
  <!-- Mountains -->
  <polygon points="0,450 200,300 400,450" fill="#2d3436"/>
  <polygon points="300,450 500,250 700,450" fill="#636e72"/>
  <polygon points="500,450 650,350 800,450" fill="#2d3436"/>
  
  <!-- Color bars for testing -->
  <rect x="50" y="50" width="100" height="50" fill="#ff0000"/>
  <rect x="160" y="50" width="100" height="50" fill="#00ff00"/>
  <rect x="270" y="50" width="100" height="50" fill="#0000ff"/>
  <rect x="380" y="50" width="100" height="50" fill="#ffff00"/>
  <rect x="490" y="50" width="100" height="50" fill="#ff00ff"/>
  <rect x="600" y="50" width="100" height="50" fill="#00ffff"/>
  
  <!-- Grayscale bar -->
  <rect x="50" y="110" width="700" height="30" fill="#ffffff"/>
  <rect x="50" y="110" width="116" height="30" fill="#eeeeee"/>
  <rect x="166" y="110" width="116" height="30" fill="#dddddd"/>
  <rect x="282" y="110" width="116" height="30" fill="#bbbbbb"/>
  <rect x="398" y="110" width="116" height="30" fill="#888888"/>
  <rect x="514" y="110" width="116" height="30" fill="#555555"/>
  <rect x="630" y="110" width="120" height="30" fill="#222222"/>
  
  <!-- Skin tone patches -->
  <circle cx="100" cy="200" r="30" fill="#ffdbac"/>
  <circle cx="180" cy="200" r="30" fill="#f1c27d"/>
  <circle cx="260" cy="200" r="30" fill="#e0ac69"/>
  <circle cx="340" cy="200" r="30" fill="#c68642"/>
  <circle cx="420" cy="200" r="30" fill="#8d5524"/>
  
  <!-- Text label -->
  <text x="400" y="550" font-family="Arial" font-size="24" fill="white" text-anchor="middle">Color Test Image</text>
</svg>