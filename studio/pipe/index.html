<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint: the suite preference if there is
      // one, otherwise the OS. Mirrors applyTheme() in shared/chrome so the
      // header never flashes the wrong appearance on load.
      (function () {
        try {
          var stored = localStorage.getItem('studio:theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('dark-theme', theme === 'dark');
          root.style.colorScheme = theme;
          // Font size is the same kind of preference: apply it in the same pass, so
          // the chrome does not resize once React mounts.
          var size = localStorage.getItem('studio:font-size');
          if (size === 'small' || size === 'large') root.setAttribute('data-font-size', size);
          else root.removeAttribute('data-font-size');
        } catch (e) { /* storage blocked: keep the markup's own default */ }
      })();
    </script>

         /datamorph/ path. `scripts/build.js` only rewrites paths in the copy it
         places under dist/, so a root-absolute href here stays broken in the
         source and 404s on every load at the canonical path. -->
