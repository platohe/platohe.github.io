<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Studio — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 480px; }
    .icon { font-size: 64px; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: #a0a0a0; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #106ebe; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎨</div>
    <h1>You're offline</h1>
    <p>Canvas Studio requires an internet connection for the first load. Once loaded, you can work fully offline — your projects are saved locally.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
