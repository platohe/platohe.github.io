<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e639c"/>
      <stop offset="100%" style="stop-color:#1177bb"/>
    </linearGradient>
  </defs>
  
  <!-- Main shape - document with corner fold -->
  <rect x="15" y="10" width="55" height="70" rx="4" fill="url(#bg)"/>
  <polygon points="70,10 70,35 85,35" fill="#0a4d7a"/>
  <rect x="70" y="10" width="15" height="25" fill="#e8f4fc"/>
  
  <!-- Magnifying glass overlay -->
  <circle cx="55" cy="55" r="18" fill="none" stroke="#ffffff" stroke-width="4"/>
  <line x1="68" y1="68" x2="82" y2="82" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  
  <!-- File lines -->
  <line x1="28" y1="25" x2="58" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="38" x2="58" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="28" y1="51" x2="45" y2="51" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
